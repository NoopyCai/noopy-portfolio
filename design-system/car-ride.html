<!-- @dsCard group="車廂 Car" -->
<title>車廂合成 — 靜態車廂 × live 車窗 × 每站燈光</title>
<style>
  :root{--green:#06ff31;--mono:ui-monospace,"SF Mono","JetBrains Mono","Roboto Mono",Menlo,monospace}
  *{box-sizing:border-box}
  body{margin:0;background:#05060a;color:#cdd6cf;font-family:var(--mono);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
  .stage{position:relative;width:100%;max-width:1180px;line-height:0}
  .cabin{width:100%;height:auto;display:block;transition:filter .8s ease}
  .grade{position:absolute;inset:0;pointer-events:none;transition:background .8s ease}
  .win{position:absolute;overflow:hidden}
  .win canvas{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;display:block}
  .led{position:absolute;left:22.4%;top:4.1%;width:55.8%;height:6.2%;overflow:hidden;display:flex;align-items:center;background:#050805}
  .led .t{white-space:nowrap;font-weight:700;font-size:clamp(9px,1.35vw,19px);letter-spacing:.12em;
    color:var(--green);text-shadow:0 0 6px rgba(6,255,49,.85);animation:marq 20s linear infinite}
  @keyframes marq{from{transform:translateX(28%)}to{transform:translateX(-72%)}}
  .hud{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;line-height:1.4}
  .hud button{font-family:var(--mono);font-size:12px;letter-spacing:.05em;padding:8px 12px;cursor:pointer;
    border:1px solid #2a332a;border-radius:8px;background:#111713;color:#8b978c;transition:.2s}
  .hud button.on{background:var(--green);color:#06210c;font-weight:700;border-color:var(--green)}
  .cap{color:#77857a;font-size:12px;letter-spacing:.08em;text-align:center}
  @media(prefers-reduced-motion:reduce){.led .t{animation:none}}
</style>

      const hs=(x,y,w,c)=>{R(x,y,w,7,c);R(x,y,w,1,'rgba(255,255,255,0.5)');for(let a=x+1;a<x+w-1;a+=4)R(a,y+2,3,3,'rgba(255,255,255,0.92)');};
      const vs=(x,y,h,c)=>{R(x,y,4,h,c);R(x,y,4,1,'rgba(255,255,255,0.5)');for(let a=y+1;a<y+h-1;a+=4)R(x+1,a,2,3,'rgba(255,255,255,0.92)');};
      hs(3,86,14,Sg[0]);hs(22,80,11,Sg[1]);hs(38,92,16,Sg[2]);hs(57,84,13,Sg[3]);hs(74,94,16,Sg[4]);hs(151,84,17,Sg[5]);hs(190,88,15,Sg[0]);
      vs(17,80,22,Sg[1]);vs(70,84,24,Sg[2]);vs(147,74,30,Sg[3]);vs(187,78,22,Sg[5]);
      R(0,104,W,H,'#3a3f45');R(0,104,W,2,'#4a4f55');for(let x=0;x<W;x+=14)R(x,113,7,2,'#d8d2b8');
      R(20,110,20,7,'#d64b3f');R(22,107,15,4,'#d64b3f');R(24,108,10,2,'#bfe6f4');R(120,111,16,6,'#eef2f5');R(122,108,11,4,'#eef2f5');R(123,109,8,2,'#bfe6f4');
    }else if(type==='field'){
      grad(0,80,[[0,'#c2531a'],[.4,'#ea8330'],[.6,'#f2c07a'],[.66,'#3a4a2c'],[1,'#1a2416']]);
      for(let x=0;x<W;x++){const m=(54+Math.sin(x*0.05)*6+Math.sin(x*0.13)*4)|0;for(let dy=m*K;dy<80*K;dy++){PX(x*K,dy,'#243018');PX(x*K+1,dy,'#243018');}}
      R(0,80,W,H,'#16210f');for(let ry=84;ry<H;ry+=6)for(let dx=0;dx<DW;dx++){const t=(1-(ry-84)/46)*0.4;if(dith(dx,ry*K,t))PX(dx,ry*K,'rgba(242,170,90,0.4)');}
      for(let i=0;i<6;i++)R(16+i*32+(rnd()*10|0),56+(rnd()*4|0),1,1,'#ffd27a');if(!bg){R(150,48,10,8,'#0e160a');R(151,45,8,3,'#0e160a');}
    }else if(type==='sea'){
      grad(0,74,[[0,'#182a4a'],[.34,'#b8492a'],[.5,'#f2a25a'],[.6,'#f6c98a'],[1,'#0d2438']]);if(!bg)disc(70,52,8,'#ffe9c2',7);
      R(0,74,W,H,'#0a1c2c');for(let wy=76;wy<H;wy+=5)for(let dx=0;dx<DW;dx++){const t=(1-(wy-76)/48)*0.3;if(dith(dx,wy*K,t))PX(dx,wy*K,'rgba(120,170,210,0.35)');}
      if(!bg){for(let dy=74*K;dy<DH;dy++){const t=(1-(dy/K-74)/50)*0.7;for(let dx=64*K;dx<76*K;dx++)if(dith(dx,dy,t))PX(dx,dy,'rgba(255,215,140,0.55)');}
      R(120,70,10,4,'#0c1a12');R(124,66,1,5,'#0c1a12');for(let x=150;x<200;x++){const c=(64-(x-150)*0.2)|0;R(x,c,1,72-c,'#0a1a10');}}
    }
  }

  const led=document.getElementById('led'),cabin=document.getElementById('cabin'),grade=document.getElementById('grade'),hud=document.getElementById('hud'),stage=document.getElementById('stage');
  // all black windows in the cabin image (pct of image) + which slice of the scene each shows
  const WINS=[
    {left:31.2, top:32.7, w:37.6, h:32.9, r:'4% / 8%',  pos:'center'},       // central window
    {left:3.2,  top:34.5, w:6.9,  h:29.6, r:'26% / 8%', pos:'22% center'},   // left window
    {left:89.9, top:34.5, w:7.3,  h:29.6, r:'26% / 8%', pos:'78% center'},   // right window
  ];
  const wins=WINS.map(wd=>{const d=document.createElement('div');d.className='win';
    d.style.cssText=`left:${wd.left}%;top:${wd.top}%;width:${wd.w}%;height:${wd.h}%;border-radius:${wd.r}`;
    const c=document.createElement('canvas');c.style.objectPosition=wd.pos;d.appendChild(c);stage.appendChild(d);return c;});
  function go(i){const s=ST[i];wins.forEach((c,idx)=>drawScene(c,s.fn,idx!==0));
    led.textContent=('◄ '+s.led+' ►　').repeat(3);
    cabin.style.filter=s.filter;grade.style.background=s.grade;grade.style.mixBlendMode=s.blend;
    [...hud.children].forEach((b,k)=>b.classList.toggle('on',k===i));}
  ST.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.zh;b.onclick=()=>go(i);hud.appendChild(b);});
  go(1);
</script>
