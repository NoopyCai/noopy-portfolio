<!-- @dsCard group="場景 Scenery" -->
<title>車窗風景 — 黃昏城市 / 南迴海景</title>
<style>
  :root{--green:#06ff31;--mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace}
  body{margin:0;background:#0c0f0c;color:#cdd6cf;font-family:var(--mono);min-height:100vh;
    display:flex;flex-direction:column}
  .bar{display:flex;gap:10px;align-items:center;padding:14px 18px;border-bottom:1px solid #1e261e}
  .bar b{color:var(--green);letter-spacing:.12em;font-size:14px}
  .toggle{margin-left:auto;display:flex;border:1px solid #2a332a;border-radius:8px;overflow:hidden}
  .toggle button{font-family:var(--mono);font-size:12px;padding:8px 12px;border:0;cursor:pointer;background:#141a14;color:#8b978c}
  .toggle button.on{background:var(--green);color:#06210c;font-weight:700}
  .stage{flex:1;display:grid;place-items:center;padding:22px}
  .win{position:relative;width:100%;max-width:760px;aspect-ratio:16/10;border-radius:20px;overflow:hidden;
    border:3px solid #39496a;box-shadow:inset 0 0 60px rgba(0,0,0,.7)}
  .sky{position:absolute;inset:0}
  .sky.city{background:linear-gradient(180deg,#b2380c,#ea8330 42%,#f2ac57 66%,#101610 68%)}
  .sky.sea{background:linear-gradient(180deg,#123049 0%,#1b3a5b 46%,#274b6b 60%,#0b1a26 62%,#050b12 100%)}
  canvas{position:absolute;left:0;right:0;bottom:0;height:46%;width:100%}
  .glass{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.08),transparent 24%,transparent 78%,rgba(255,255,255,.05))}
</style>
<div class="bar"><b>車窗風景 Window Scenery</b>
  <div class="toggle"><button id="c" class="on" onclick="set('city')">黃昏城市</button><button id="s" onclick="set('sea')">南迴海景</button></div>
</div>
<div class="stage"><div class="win"><div class="sky city" id="sky"></div><canvas id="cv"></canvas><div class="glass"></div></div></div>
<script>
  const sky=document.getElementById('sky'),cv=document.getElementById('cv'),cx=cv.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  let mode='city',W,H,items=[],off=0;
  function set(m){mode=m;sky.className='sky '+m;i.classList.toggle('on',false);build();
    c.classList.toggle('on',m==='city');s.classList.toggle('on',m==='sea');}
  function build(){const r=cv.getBoundingClientRect();cv.width=W=r.width|0;cv.height=H=r.height|0;items=[];
    if(mode==='city'){let x=0;while(x<W){const w=6+Math.random()*20,h=H*(.3+Math.random()*.7);
      const l=[];for(let ly=H-h+4;ly<H-3;ly+=5)for(let lx=x+2;lx<x+w-2;lx+=4)if(Math.random()>.5)l.push([lx,ly]);
      items.push({x,w,h,l});x+=w+2+Math.random()*6}}
    else{for(let i=0;i<3;i++)items.push({y:H*(.2+i*.22),amp:6+i*4,k:0.02+i*0.006})}}
  function draw(){cx.clearRect(0,0,W,H);
    if(mode==='city'){for(const d of[-W,0])for(const b of items){const bx=b.x-(off%W)+d;if(bx>W||bx+b.w<0)continue;
      cx.fillStyle='#0b0f0b';cx.fillRect(bx,H-b.h,b.w,b.h);cx.fillStyle='#ffb24d';
      for(const[lx,ly]of b.l)cx.fillRect(lx-(off%W)+d,ly,2,2)}}
    else{for(const w of items){cx.strokeStyle='rgba(140,190,230,.5)';cx.beginPath();
      for(let x=0;x<=W;x+=6){const y=w.y+Math.sin((x+off)*w.k)*w.amp;x?cx.lineTo(x,y):cx.moveTo(x,y)}cx.stroke()}
      cx.fillStyle='rgba(255,220,150,.7)';for(let i=0;i<20;i++)cx.fillRect((i*61-off*0.4)%W,H*0.16,2,2)}}
  function loop(){if(!reduce)off+=mode==='city'?0.6:0.8;draw();requestAnimationFrame(loop)}
  addEventListener('resize',build);build();draw();if(!reduce)loop();
</script>
