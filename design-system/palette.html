<title>配色板 — 夜車・區間 Palette</title>
<style>
  :root{--mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace}

  h1{font-size:14px;letter-spacing:.14em;color:#06ff31;margin:0 0 4px}
