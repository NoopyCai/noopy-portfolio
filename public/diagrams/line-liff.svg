<svg viewBox="0 0 720 405" xmlns="http://www.w3.org/2000/svg">
<!-- LINE LIFF × Magento2 會員綁定:路線圖視覺語言。手寫 SVG,無外部工具匯出。
     字級全數 >=13(規格底線),沿用寬鬆間距,不縮字。 -->
<style>
.lnA{stroke:#f2c230;stroke-width:4;fill:none;stroke-linecap:round}
.lnB{stroke:#8b98ad;stroke-width:2;fill:none;stroke-linecap:round}
.dot{fill:#f2c230}
.node{fill:rgba(15,22,34,.92);stroke:#8b98ad;stroke-opacity:.4;stroke-width:1.5}
.ext{stroke-dasharray:4 3;stroke-opacity:.75}
.zh{font-family:-apple-system,"PingFang TC",sans-serif;fill:#e9eff8;text-anchor:middle}
.mono{font-family:"Departure Mono",ui-monospace,monospace;fill:#e9eff8;text-anchor:middle}
.arrow{font-family:"Departure Mono",ui-monospace,monospace;fill:#f2c230;text-anchor:middle}
.arrowB{font-family:"Departure Mono",ui-monospace,monospace;fill:#8b98ad;text-anchor:middle}
.tag{font-family:-apple-system,"PingFang TC",sans-serif;fill:#f2c230;text-anchor:middle}
.cap{font-family:-apple-system,"PingFang TC",sans-serif;fill:#8b98ad;text-anchor:middle}
.ring{fill:none;stroke:#f2c230}
.chip{fill:#0f1622}
</style>

<!-- 主線:LINE 使用者 → LIFF → GCF → Magento2 -->
<path class="lnA" d="M100,210 H130" />
<path class="lnA" d="M228,210 H258" />
<path class="lnA" d="M396,210 H426" />
<!-- GCF 下掛合併儲存節點 -->
<path class="lnA" d="M327,233 V278" />
<!-- Magento2 綁定歸戶結果 -->
<path class="lnB" d="M471,233 V257" />

<circle class="chip" cx="115" cy="210" r="9" />
<circle class="chip" cx="243" cy="210" r="9" />
<circle class="chip" cx="411" cy="210" r="9" />
<text class="arrow" x="115" y="215" font-size="16">►</text>
<text class="arrow" x="243" y="215" font-size="16">►</text>
<text class="arrow" x="411" y="215" font-size="16">►</text>

<!-- 節點:LINE App 使用者(外部系統,虛線) -->
<rect class="node ext" x="10" y="187" width="90" height="46" rx="8" />
<text class="mono" x="55" y="206" font-size="13">LINE App</text>
<text class="zh" x="55" y="222" font-size="13">使用者</text>

<!-- 節點:LIFF SPA(Vue3+Vite) -->
<rect class="node" x="130" y="187" width="98" height="46" rx="8" />
<text class="mono" x="179" y="206" font-size="13">LIFF SPA</text>
<text class="mono" x="179" y="222" font-size="13">Vue3+Vite</text>

<!-- 節點:GCF Serverless API · API 邊界 = 轉乘站樣式 -->
<circle class="ring" cx="327" cy="173" r="7" stroke-width="1.5" />
<circle class="dot" cx="327" cy="173" r="2.8" />
<rect class="node" x="258" y="187" width="138" height="46" rx="8" />
<text class="mono" x="327" y="206" font-size="13">GCF</text>
<text class="mono" x="327" y="222" font-size="13">Serverless API</text>

<!-- 節點:合併儲存(不標注誰存哪個) -->
<rect class="node" x="257" y="278" width="140" height="46" rx="8" />
<text class="mono" x="327" y="297" font-size="13">Redis · MySQL</text>
<text class="zh" x="327" y="313" font-size="13">Token / 綁定資料</text>

<!-- 節點:Magento2 會員系統 -->
<rect class="node" x="426" y="187" width="90" height="46" rx="8" />
<text class="mono" x="471" y="206" font-size="13">Magento2</text>
<text class="zh" x="471" y="222" font-size="13">會員系統</text>

<!-- 驗證方式標籤(LIFF ↔ GCF 段) -->
<text class="tag" x="243" y="248" font-size="13">AES-256 時效 Token</text>
<text class="tag" x="243" y="262" font-size="13">+ Email OTP</text>

<!-- 結果標籤 -->
<text class="cap" x="471" y="272" font-size="13" fill="#f2c230">綁定歸戶</text>

<!-- 支線:業務員 QR 邀請 → LIFF(帶參數) → 綁定歸戶(走 LIFF 左側,不與 AES 標籤同一縱列) -->
<rect class="node" x="10" y="330" width="66" height="40" rx="8" />
<text class="zh" x="43" y="355" font-size="13">業務員</text>
<path class="lnB" d="M76,350 H130" />
<text class="cap" x="105" y="340" font-size="13">QR 邀請</text>
<circle class="chip" cx="138" cy="350" r="8" />
<text class="arrowB" x="138" y="355" font-size="13">►</text>
<path class="lnB" d="M146,350 L133,233" />
<text class="cap" x="185" y="300" font-size="13">LIFF(帶參數)</text>
</svg>
