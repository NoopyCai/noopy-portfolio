<svg viewBox="0 0 720 405" xmlns="http://www.w3.org/2000/svg">
<!-- LINE LIFF × Magento2 會員綁定:路線圖視覺語言。手寫 SVG,無外部工具匯出。 -->
<style>
.lnA{stroke:#f2c230;stroke-width:4;fill:none;stroke-linecap:round}
.lnB{stroke:#8b98ad;stroke-width:2;fill:none;stroke-linecap:round}
.dot{fill:#f2c230}
.node{fill:rgba(15,22,34,.92);stroke:#8b98ad;stroke-opacity:.4;stroke-width:1.5}
.ext{stroke-dasharray:4 3;stroke-opacity:.75}
.zh{font-family:-apple-system,"PingFang TC",sans-serif;fill:#e9eff8;text-anchor:middle}
.mono{font-family:"Departure Mono",ui-monospace,monospace;fill:#e9eff8;text-anchor:middle}
.arrow{font-family:"Departure Mono",ui-monospace,monospace;fill:#f2c230;text-anchor:middle}
.arrowB{font-family:"Departure Mono",ui-monospace,monospace;fill:#8b98ad;text-anchor:middle}
.tag{font-family:-apple-system,"PingFang TC",sans-serif;fill:#f2c230;text-anchor:middle}
.cap{font-family:-apple-system,"PingFang TC",sans-serif;fill:#8b98ad;text-anchor:middle}
.ring{fill:none;stroke:#f2c230}
.chip{fill:#0f1622}
</style>

<!-- 主線:LINE 使用者 → LIFF → GCF → Magento2 -->
<path class="lnA" d="M130,210 H170" />
<path class="lnA" d="M290,210 H330" />
<path class="lnA" d="M460,210 H500" />
<!-- GCF 下掛合併儲存節點 -->
<path class="lnA" d="M395,230 V268" />
<!-- Magento2 綁定歸戶結果 -->
<path class="lnB" d="M570,230 V254" />

<circle class="chip" cx="150" cy="210" r="9" />
<circle class="chip" cx="310" cy="210" r="9" />
<circle class="chip" cx="480" cy="210" r="9" />
<text class="arrow" x="150" y="215" font-size="15">►</text>
<text class="arrow" x="310" y="215" font-size="15">►</text>
<text class="arrow" x="480" y="215" font-size="15">►</text>

<!-- 節點:LINE App 使用者(外部系統,虛線) -->
<rect class="node ext" x="10" y="190" width="120" height="40" rx="8" />
<text class="mono" x="70" y="206" font-size="12">LINE App</text>
<text class="zh" x="70" y="222" font-size="12">使用者</text>

<!-- 節點:LIFF SPA(Vue3+Vite) -->
<rect class="node" x="170" y="190" width="120" height="40" rx="8" />
<text class="mono" x="230" y="206" font-size="11.5">LIFF SPA</text>
<text class="mono" x="230" y="221" font-size="10.5">Vue3+Vite</text>

<!-- 節點:GCF Serverless API · API 邊界 = 轉乘站樣式 -->
<circle class="ring" cx="395" cy="176" r="7" stroke-width="1.5" />
<circle class="dot" cx="395" cy="176" r="2.8" />
<rect class="node" x="330" y="190" width="130" height="40" rx="8" />
<text class="mono" x="395" y="205" font-size="12">GCF</text>
<text class="mono" x="395" y="221" font-size="9.5">Serverless API</text>

<!-- 節點:合併儲存(不標注誰存哪個) -->
<rect class="node" x="320" y="268" width="150" height="46" rx="8" />
<text class="mono" x="395" y="286" font-size="11">Redis · MySQL</text>
<text class="zh" x="395" y="302" font-size="10">Token / 綁定資料</text>

<!-- 節點:Magento2 會員系統 -->
<rect class="node" x="500" y="190" width="140" height="40" rx="8" />
<text class="mono" x="570" y="206" font-size="12">Magento2</text>
<text class="zh" x="570" y="222" font-size="12">會員系統</text>

<!-- 驗證方式標籤(LIFF ↔ GCF 段) -->
<text class="tag" x="310" y="252" font-size="10.5">AES-256 時效 Token</text>
<text class="tag" x="310" y="266" font-size="10.5">+ Email OTP</text>

<!-- 結果標籤 -->
<text class="cap" x="570" y="267" font-size="12" fill="#f2c230">綁定歸戶</text>

<!-- 支線:業務員 QR 邀請 → LIFF(帶參數) → 綁定歸戶 -->
<rect class="node" x="10" y="320" width="90" height="36" rx="8" />
<text class="zh" x="55" y="343" font-size="13">業務員</text>
<path class="lnB" d="M100,338 H160" />
<text class="cap" x="130" y="333" font-size="10.5">QR 邀請</text>
<circle class="chip" cx="168" cy="338" r="7" />
<text class="arrowB" x="168" y="343" font-size="12">►</text>
<path class="lnB" d="M176,338 L230,230" />
<text class="cap" x="248" y="288" font-size="10">LIFF(帶參數)</text>
</svg>
