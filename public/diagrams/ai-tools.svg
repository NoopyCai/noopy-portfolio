<svg viewBox="0 0 720 405" xmlns="http://www.w3.org/2000/svg">
<!-- AI 工具整合:路線圖視覺語言,一個入口分三條支線。手寫 SVG,無外部工具匯出。
     字級全數 >=13(規格底線),節點加寬、間距重排,不縮字。 -->
<style>
.lnA{stroke:#f2c230;stroke-width:4;fill:none;stroke-linecap:round}
.dot{fill:#f2c230}
.node{fill:rgba(15,22,34,.92);stroke:#8b98ad;stroke-opacity:.4;stroke-width:1.5}
.ext{stroke-dasharray:4 3;stroke-opacity:.75}
.zh{font-family:-apple-system,"PingFang TC",sans-serif;fill:#e9eff8;text-anchor:middle}
.mono{font-family:"Departure Mono",ui-monospace,monospace;fill:#e9eff8;text-anchor:middle}
.arrow{font-family:"Departure Mono",ui-monospace,monospace;fill:#f2c230;text-anchor:middle}
.chip{fill:#0f1622}
</style>

<!-- 共同入口 -->
<rect class="node ext" x="10" y="13" width="160" height="44" rx="8" />
<text class="zh" x="90" y="40" font-size="13">Google 網域帳號登入</text>

<!-- 入口分三線 -->
<path class="lnA" d="M170,35 L146,110" />
<path class="lnA" d="M170,35 L146,220" />
<path class="lnA" d="M170,35 L146,330" />
<circle class="dot" cx="146" cy="110" r="3.5" />
<circle class="dot" cx="146" cy="220" r="3.5" />
<circle class="dot" cx="146" cy="330" r="3.5" />

<!-- 支線一:週報 -->
<path class="lnA" d="M297,110 H313" />
<path class="lnA" d="M369,110 H385" />
<path class="lnA" d="M463,110 H479" />
<path class="lnA" d="M535,110 H551" />
<circle class="chip" cx="305" cy="110" r="8" />
<circle class="chip" cx="377" cy="110" r="8" />
<circle class="chip" cx="471" cy="110" r="8" />
<circle class="chip" cx="543" cy="110" r="8" />
<text class="arrow" x="305" y="115" font-size="14">►</text>
<text class="arrow" x="377" y="115" font-size="14">►</text>
<text class="arrow" x="471" y="115" font-size="14">►</text>
<text class="arrow" x="543" y="115" font-size="14">►</text>

<rect class="node" x="150" y="87" width="147" height="46" rx="8" />
<text class="mono" x="223" y="106" font-size="13">Cloud Scheduler</text>
<text class="zh" x="223" y="122" font-size="13">排程</text>

<rect class="node" x="313" y="90" width="56" height="40" rx="8" />
<text class="mono" x="341" y="115" font-size="13">RSS</text>

<rect class="node" x="385" y="87" width="78" height="46" rx="8" />
<text class="mono" x="424" y="106" font-size="13">Gemini</text>
<text class="zh" x="424" y="122" font-size="13">摘要</text>

<rect class="node" x="479" y="90" width="56" height="40" rx="8" />
<text class="mono" x="507" y="115" font-size="13">PDF</text>

<rect class="node ext" x="551" y="87" width="118" height="46" rx="8" />
<text class="mono" x="610" y="106" font-size="13">Google Chat</text>
<text class="zh" x="610" y="122" font-size="13">推送</text>

<!-- 支線二:Blog -->
<path class="lnA" d="M258,220 H274" />
<path class="lnA" d="M414,220 H430" />
<circle class="chip" cx="266" cy="220" r="8" />
<circle class="chip" cx="422" cy="220" r="8" />
<text class="arrow" x="266" y="225" font-size="14">►</text>
<text class="arrow" x="422" y="225" font-size="14">►</text>

<rect class="node" x="150" y="200" width="108" height="40" rx="8" />
<text class="mono" x="204" y="225" font-size="13">Google Doc</text>

<rect class="node" x="274" y="197" width="140" height="46" rx="8" />
<text class="mono" x="344" y="216" font-size="13">Doc → HTML</text>
<text class="zh" x="344" y="232" font-size="13">+ 圖片 ALT 生成</text>

<rect class="node" x="430" y="200" width="56" height="40" rx="8" />
<text class="zh" x="458" y="225" font-size="13">上稿</text>

<!-- 支線三:商品 -->
<path class="lnA" d="M232,330 H248" />
<path class="lnA" d="M317,330 H333" />
<circle class="chip" cx="240" cy="330" r="8" />
<circle class="chip" cx="325" cy="330" r="8" />
<text class="arrow" x="240" y="335" font-size="14">►</text>
<text class="arrow" x="325" y="335" font-size="14">►</text>

<rect class="node" x="150" y="310" width="82" height="40" rx="8" />
<text class="zh" x="191" y="335" font-size="13">商品資料</text>

<rect class="node" x="248" y="307" width="69" height="46" rx="8" />
<text class="mono" x="282" y="326" font-size="13">JSONL</text>
<text class="zh" x="282" y="342" font-size="13">匯出</text>

<rect class="node" x="333" y="310" width="69" height="40" rx="8" />
<text class="zh" x="367" y="335" font-size="13">供檢索</text>
</svg>
