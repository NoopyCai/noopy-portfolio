<svg viewBox="0 0 720 405" xmlns="http://www.w3.org/2000/svg">
<!-- AI 工具整合:路線圖視覺語言,一個入口分三條支線。手寫 SVG,無外部工具匯出。 -->
<style>
.lnA{stroke:#f2c230;stroke-width:4;fill:none;stroke-linecap:round}
.dot{fill:#f2c230}
.node{fill:rgba(15,22,34,.92);stroke:#8b98ad;stroke-opacity:.4;stroke-width:1.5}
.ext{stroke-dasharray:4 3;stroke-opacity:.75}
.zh{font-family:-apple-system,"PingFang TC",sans-serif;fill:#e9eff8;text-anchor:middle}
.mono{font-family:"Departure Mono",ui-monospace,monospace;fill:#e9eff8;text-anchor:middle}
.arrow{font-family:"Departure Mono",ui-monospace,monospace;fill:#f2c230;text-anchor:middle}
.chip{fill:#0f1622}
</style>

<!-- 共同入口 -->
<rect class="node ext" x="10" y="15" width="150" height="44" rx="8" />
<text class="zh" x="85" y="42" font-size="11.5">Google 網域帳號登入</text>

<!-- 入口分三線 -->
<path class="lnA" d="M160,37 L136,110" />
<path class="lnA" d="M160,37 L136,220" />
<path class="lnA" d="M160,37 L136,330" />
<circle class="dot" cx="136" cy="110" r="3.5" />
<circle class="dot" cx="136" cy="220" r="3.5" />
<circle class="dot" cx="136" cy="330" r="3.5" />

<!-- 支線一:週報 -->
<path class="lnA" d="M244,110 H260" />
<path class="lnA" d="M316,110 H332" />
<path class="lnA" d="M428,110 H444" />
<path class="lnA" d="M498,110 H514" />
<circle class="chip" cx="252" cy="110" r="8" />
<circle class="chip" cx="324" cy="110" r="8" />
<circle class="chip" cx="436" cy="110" r="8" />
<circle class="chip" cx="506" cy="110" r="8" />
<text class="arrow" x="252" y="115" font-size="13">►</text>
<text class="arrow" x="324" y="115" font-size="13">►</text>
<text class="arrow" x="436" y="115" font-size="13">►</text>
<text class="arrow" x="506" y="115" font-size="13">►</text>

<rect class="node" x="140" y="90" width="104" height="40" rx="8" />
<text class="mono" x="192" y="104" font-size="9">Cloud Scheduler</text>
<text class="zh" x="192" y="120" font-size="11">排程</text>

<rect class="node" x="260" y="90" width="56" height="40" rx="8" />
<text class="mono" x="288" y="115" font-size="13">RSS</text>

<rect class="node" x="332" y="90" width="96" height="40" rx="8" />
<text class="mono" x="380" y="105" font-size="11">Gemini</text>
<text class="zh" x="380" y="121" font-size="11">摘要</text>

<rect class="node" x="444" y="90" width="54" height="40" rx="8" />
<text class="mono" x="471" y="115" font-size="13">PDF</text>

<rect class="node ext" x="514" y="90" width="118" height="40" rx="8" />
<text class="mono" x="573" y="105" font-size="10">Google Chat</text>
<text class="zh" x="573" y="121" font-size="11">推送</text>

<!-- 支線二:Blog -->
<path class="lnA" d="M230,220 H246" />
<path class="lnA" d="M436,220 H452" />
<circle class="chip" cx="238" cy="220" r="8" />
<circle class="chip" cx="444" cy="220" r="8" />
<text class="arrow" x="238" y="225" font-size="13">►</text>
<text class="arrow" x="444" y="225" font-size="13">►</text>

<rect class="node" x="140" y="200" width="90" height="40" rx="8" />
<text class="mono" x="185" y="225" font-size="10">Google Doc</text>

<rect class="node" x="246" y="197" width="190" height="46" rx="8" />
<text class="mono" x="341" y="214" font-size="10">Doc → HTML</text>
<text class="zh" x="341" y="230" font-size="10">+ 圖片 ALT 生成</text>

<rect class="node" x="452" y="200" width="64" height="40" rx="8" />
<text class="zh" x="484" y="225" font-size="14">上稿</text>

<!-- 支線三:商品 -->
<path class="lnA" d="M230,330 H246" />
<path class="lnA" d="M346,330 H362" />
<circle class="chip" cx="238" cy="330" r="8" />
<circle class="chip" cx="354" cy="330" r="8" />
<text class="arrow" x="238" y="335" font-size="13">►</text>
<text class="arrow" x="354" y="335" font-size="13">►</text>

<rect class="node" x="140" y="310" width="90" height="40" rx="8" />
<text class="zh" x="185" y="335" font-size="13">商品資料</text>

<rect class="node" x="246" y="310" width="100" height="40" rx="8" />
<text class="mono" x="296" y="326" font-size="12">JSONL</text>
<text class="zh" x="296" y="341" font-size="11">匯出</text>

<rect class="node" x="362" y="310" width="80" height="40" rx="8" />
<text class="zh" x="402" y="335" font-size="13">供檢索</text>
</svg>
